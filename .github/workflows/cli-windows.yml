name: CLI Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  native-windows:
    name: windows (${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - run: npm run test:windows
      - run: npm run test:tui
      - run: npm run build:tui:host
      - run: node bin/cli.js --version
      - run: node bin/cli.js help
      - name: Pack all platform binaries
        if: matrix.node == 22
        run: npm pack --pack-destination .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.node == 22
        with:
          name: cli-preview-package
          path: subconscious-cli-*.tgz
          if-no-files-found: error

  unix-regression:
    name: unix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - run: npm test
      - run: npm run test:tui
      - run: npm run build:tui:host

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev
      - name: Scan the TUI module
        working-directory: tui
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Generate Go SBOM
        working-directory: tui
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod -json -output "$GITHUB_WORKSPACE/sbom-go.cdx.json" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-go
          path: sbom-go.cdx.json
          if-no-files-found: error
