# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Keeps one release PR open against main. Merging it bumps package.json,
      # writes CHANGELOG.md, and tags vX.Y.Z. The publish job below runs only
      # when that tag is created.
      #
      # bootstrap-sha in release-please-config.json is the main commit that
      # already published subconscious-cli@5.0.3. Commits before that SHA are
      # not released. docs, chore, and ci commits do not open a release PR.
      #
      # RELEASE_GITHUB_TOKEN is a maintainer PAT that can push the release PR
      # onto protected main. GITHUB_TOKEN cannot.
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SUBCONSCIOUS_RELEASE_PLEASE: "1"
