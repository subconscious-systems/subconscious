# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Keeps one release PR open against main. Merging it bumps package.json,
      # writes CHANGELOG.md, and tags vX.Y.Z. The publish job below runs only
      # when that tag is created.
      #
      # bootstrap-sha in release-please-config.json is the main commit that
      # already published subconscious-cli@5.0.3. Commits before that SHA are
      # not released. docs, chore, and ci commits do not open a release PR.
      #
      # RELEASE_GITHUB_TOKEN is a maintainer PAT that can push the release
      # branch and open the pull request. GITHUB_TOKEN cannot. A person merges
      # that pull request. The publish job below uses GitHub OIDC, not this PAT.
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # id-token: write lets npm exchange this job's OIDC token for a short-lived
    # publish credential. The trusted publisher on npmjs.com must name this
    # file (release-please.yaml), org subconscious-systems, repo subconscious,
    # with no environment, and must allow direct npm publish.
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.5.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Publish to npm
        run: npm publish --access public
        env:
          SUBCONSCIOUS_RELEASE_PLEASE: "1"
      - name: Record embedded module versions
        run: |
          files=(bin/native/*)
          if [ "${#files[@]}" -eq 0 ] || [ ! -e "${files[0]}" ]; then
            echo "no native binaries were built" >&2
            exit 1
          fi
          {
            for bin in "${files[@]}"; do
              echo "# $(basename "$bin")"
              go version -m "$bin"
              echo
            done
          } > sbom-buildinfo.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-buildinfo
          path: sbom-buildinfo.txt
          if-no-files-found: error
